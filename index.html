<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Limber</title>
<meta name="description" content="Daily stretching and mobility for runners and cyclists, with guided spoken sessions and a log.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Limber">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1518" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column (max 560px), sticky header, bottom tabs. A session opens a full-screen player built around one draining ring; bedtime sessions switch the player to a dim night palette. */
:root {
  --bg: #EDF2F1;          /* morning mist */
  --surface: #FFFFFF;
  --surface-2: #DFE8E7;
  --ink: #12202A;         /* deep slate */
  --ink-2: #41525C;
  --ink-3: #6C7C85;
  --line: #CED9D9;
  --accent: #0B7A6E;      /* deep teal */
  --accent-ink: #FFFFFF;
  --accent-soft: #D1EBE6;
  --ready: #B9741A;       /* amber: get into position */
  --ready-soft: #F6E7C9;
  --slab: #12262C;
  --slab-2: #1E3940;
  --slab-ink: #EEF4F3;
  --slab-mute: #9FB4B7;
  --slab-accent: #5FD0BE;
  --good: #1F7A4A;
  --good-soft: #D5EEDF;
  --bad: #B03A32;
  --heat0: #DFE8E7; --heat1: #A9D9D0; --heat2: #4FAE9F; --heat3: #0B7A6E;
  --night-bg: #081014; --night-2: #13232A; --night-ink: #C7D5D9; --night-mute: #7E959C; --night-accent: #86B9D6;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1518; --surface: #152126; --surface-2: #1E2D33; --ink: #E3ECEB; --ink-2: #A9BABD; --ink-3: #7E9095;
    --line: #253940; --accent: #4FC1B0; --accent-ink: #052320; --accent-soft: #123A35;
    --ready: #E6A84A; --ready-soft: #3A2C14; --slab: #17323A; --slab-2: #23454E;
    --good: #5CC489; --good-soft: #173529; --bad: #EE8077;
    --heat0: #1E2D33; --heat1: #1E4A44; --heat2: #2F8577; --heat3: #4FC1B0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1518; --surface: #152126; --surface-2: #1E2D33; --ink: #E3ECEB; --ink-2: #A9BABD; --ink-3: #7E9095;
  --line: #253940; --accent: #4FC1B0; --accent-ink: #052320; --accent-soft: #123A35;
  --ready: #E6A84A; --ready-soft: #3A2C14; --slab: #17323A; --slab-2: #23454E;
  --good: #5CC489; --good-soft: #173529; --bad: #EE8077;
  --heat0: #1E2D33; --heat1: #1E4A44; --heat2: #2F8577; --heat3: #4FC1B0;
  color-scheme: dark;
}
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; color-scheme: light; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
a { color: var(--accent); }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(108px + env(safe-area-inset-bottom, 0px)); }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 1.55rem; letter-spacing: -.02em; line-height: 1; }
.brand svg { width: 24px; height: 24px; }
.spacer { flex: 1; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); }
.icon-btn svg { width: 20px; height: 20px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 10px; font-size: .76rem; font-weight: 700; color: var(--ink-3); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }

.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.h-display { font-family: var(--f-display); font-weight: 800; letter-spacing: -.025em; line-height: 1; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-block: 28px 10px; }
.sec-head h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; letter-spacing: -.01em; }
.muted { color: var(--ink-3); }
.small { font-size: .88rem; }
.hint { font-size: .85rem; color: var(--ink-3); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: .9rem; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 700; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.stack { display: grid; gap: 12px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 13px; font-size: .9rem; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg .chip { text-align: center; padding-inline: 4px; }
.ci { display: grid; gap: 16px; }
.ci .field-lbl { font-weight: 700; font-size: .9rem; margin-bottom: 8px; }
.ci h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.55rem; letter-spacing: -.02em; }

.slab { background: var(--slab); color: var(--slab-ink); border-radius: 20px; padding: 20px 18px 18px; }
.slab .eyebrow { color: var(--slab-mute); }
.slab h1 { font-size: clamp(2.2rem, 10vw, 3rem); margin-block: 6px 8px; }
.slab .why { color: var(--slab-mute); font-size: .95rem; }
.slab .btn { border-color: var(--slab-2); background: var(--slab-2); color: var(--slab-ink); }
.slab .btn.primary { background: var(--slab-accent); border-color: var(--slab-accent); color: #062420; }
.st-list { display: grid; margin-block: 14px 16px; border-top: 1px solid var(--slab-2); }
.st-li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--slab-2); }
.st-li b { font-weight: 700; }
.st-li .t { color: var(--slab-mute); font-size: .88rem; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.st-li .a { color: var(--slab-mute); font-size: .82rem; grid-column: 1 / -1; }
.st-li .tag { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; background: var(--slab-2); color: var(--slab-accent); margin-left: 6px; vertical-align: 2px; }

.banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; margin-top: 12px; }
.banner p { font-weight: 700; }
.banner.warm { background: var(--ready-soft); }

.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 4px; font-size: .74rem; color: var(--ink-3); font-weight: 700; }
.wd i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--accent-ink); font-style: normal; }
.wd.on i { background: var(--accent); }
.wd.today span { color: var(--ink); }
.wd.today i { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink-3); }
.wd i svg { width: 16px; height: 16px; }
.tip { display: flex; gap: 12px; align-items: flex-start; }
.tip svg { width: 22px; height: 22px; flex: none; color: var(--accent); margin-top: 1px; }

/* library */
.search { width: 100%; min-height: 46px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 18px; }
.lib-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.lib-head { display: flex; align-items: stretch; }
.lib-head > button:first-child { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 14px 6px 14px 16px; display: grid; gap: 4px; }
.lib-head b { font-size: 1.04rem; }
.star { background: none; border: 0; width: 52px; display: grid; place-items: center; color: var(--ink-3); }
.star svg { width: 22px; height: 22px; }
.star[aria-pressed="true"] { color: var(--ready); }
.tags { font-size: .84rem; color: var(--ink-3); }
.lib-body { padding: 0 16px 16px; display: grid; gap: 12px; }
.cues { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.cues li::marker { font-weight: 700; color: var(--accent); }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 12px; font-size: .92rem; margin: 0; }
.kv dt { color: var(--ink-3); font-weight: 700; }
.kv dd { margin: 0; min-width: 0; }

/* progress */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 2.1rem; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--ink-3); font-weight: 700; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); }
.chart .lbl { fill: var(--ink-2); font-size: 12px; font-family: var(--f-body); font-weight: 700; }
.chart .val { fill: var(--ink-2); font-size: 11.5px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.chart .bar { fill: var(--accent); }
.chart .bar0 { fill: var(--surface-2); }
.chart .stem { stroke: var(--ink-3); stroke-width: 2; stroke-linecap: round; }
.chart .stem.better { stroke: var(--accent); }
.chart .before { fill: var(--surface); stroke: var(--ink-3); stroke-width: 2; }
.chart .after { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .cell { cursor: pointer; }
.chart .h0 { fill: var(--heat0); } .chart .h1 { fill: var(--heat1); } .chart .h2 { fill: var(--heat2); } .chart .h3 { fill: var(--heat3); }
.chart .todayc { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.chart .wc { fill: var(--ink-3); font-size: 10px; font-family: var(--f-body); font-weight: 700; }
.chart .sel { stroke: var(--ink); stroke-width: 2.5; }
.readout { font-size: .9rem; color: var(--ink-2); min-height: 1.4em; margin-top: 8px; }
.legend { display: flex; gap: 14px; align-items: center; font-size: .8rem; color: var(--ink-3); margin-top: 8px; flex-wrap: wrap; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -2px; margin-right: 4px; }
.legend i.ring { border-radius: 50%; border: 2px solid var(--ink-3); background: var(--surface); }
.legend i.dot { border-radius: 50%; background: var(--accent); }
.hist-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.hist-item > button { width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; display: grid; gap: 6px; }
.hist-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.badge.good { background: var(--good-soft); color: var(--good); }
.hist-body { padding: 0 16px 14px; display: grid; gap: 10px; }
.mini-list { display: grid; gap: 4px; font-size: .9rem; }
.mini-list div { display: flex; justify-content: space-between; gap: 10px; }
.mini-list span:last-child { color: var(--ink-3); white-space: nowrap; }
.empty { text-align: center; padding: 28px 18px; border: 1.5px dashed var(--line); border-radius: var(--r); color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }

/* player */
.player { position: fixed; inset: 0; z-index: 50; background: var(--bg); color: var(--ink); overflow-y: auto; --p-accent: var(--accent); --p-ready: var(--ready); --p-track: var(--surface-2); --p-mute: var(--ink-3); --p-btn: var(--surface); --p-line: var(--line); }
.player.night { background: var(--night-bg); color: var(--night-ink); --p-accent: var(--night-accent); --p-ready: #C9A46B; --p-track: var(--night-2); --p-mute: var(--night-mute); --p-btn: var(--night-2); --p-line: #1F333B; color-scheme: dark; }
.pl-in { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(30px + env(safe-area-inset-bottom, 0px)); min-height: 100%; display: flex; flex-direction: column; }
.pl-top { display: flex; align-items: center; gap: 10px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; }
.player .icon-btn, .player .btn { background: var(--p-btn); border-color: var(--p-line); color: inherit; }
.pl-title { flex: 1; min-width: 0; display: grid; }
.pl-title b { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-title span { font-size: .85rem; color: var(--p-mute); font-variant-numeric: tabular-nums; }
.pl-prog { display: flex; gap: 4px; margin-bottom: 16px; }
.pl-prog i { flex: 1; height: 5px; border-radius: 99px; background: var(--p-track); }
.pl-prog i.d { background: var(--p-accent); }
.pl-prog i.c { background: currentColor; opacity: .85; }
.pl-eyebrow { font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--p-mute); }
.pl-name { font-family: var(--f-display); font-weight: 800; letter-spacing: -.025em; font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1; margin-block: 6px 4px; }
.ring-wrap { position: relative; width: min(74vw, 300px); aspect-ratio: 1; max-width: 100%; margin: 14px auto 6px; }
.ring-wrap svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--p-track); stroke-width: 12; }
.ring-prog { fill: none; stroke: var(--p-accent); stroke-width: 12; stroke-linecap: round; }
.ring-wrap.ready .ring-prog { stroke: var(--p-ready); }
.ring-breath { fill: var(--p-accent); opacity: .12; transform-origin: 120px 120px; transform: scale(.7); }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.ring-num { font-family: var(--f-display); font-weight: 800; font-size: clamp(3.6rem, 19vw, 5rem); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring-lbl { font-weight: 700; font-size: 1rem; }
.ring-wrap.ready .ring-lbl { color: var(--p-ready); }
.ring-sub { font-size: .85rem; color: var(--p-mute); min-height: 1.2em; }
.pl-cue { text-align: center; font-size: 1.05rem; max-width: 34ch; margin: 6px auto 0; min-height: 2.9em; }
.pl-more { text-align: center; margin-top: 4px; }
.pl-more .link-btn { color: var(--p-accent); }
.player .kv dt { color: var(--p-mute); }
.player .cues li::marker { color: var(--p-accent); }
.pl-next { text-align: center; color: var(--p-mute); font-size: .9rem; margin-top: 10px; }
.pl-controls { margin-top: auto; padding-top: 18px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.pl-controls .side { display: flex; gap: 8px; }
.pl-controls .side.r { justify-content: flex-end; }
.big-play { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--p-accent); color: var(--bg); display: grid; place-items: center; }
.player.night .big-play { color: var(--night-bg); }
.big-play svg { width: 30px; height: 30px; }
.round { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--p-line); background: var(--p-btn); display: grid; place-items: center; color: inherit; font-weight: 700; font-size: .85rem; }
.round svg { width: 22px; height: 22px; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(6, 14, 18, .55); }
.sheet-panel { position: relative; width: 100%; max-width: 560px; max-height: 90%; overflow-y: auto; background: var(--bg); color: var(--ink); border-radius: 22px 22px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet-grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 12px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.sheet-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; letter-spacing: -.02em; line-height: 1.02; }
.field { display: grid; gap: 8px; margin-bottom: 18px; }
.field > label, .field > .lbl { font-weight: 700; font-size: .92rem; }
.input { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; width: 100%; }
textarea.input { min-height: 80px; padding: 10px 12px; resize: vertical; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; max-width: calc(100% - 32px); text-align: center; }
.update-bar { position: fixed; z-index: 40; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: 528px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 10px 10px 10px 16px; font-weight: 700; font-size: .92rem; }

@media (prefers-reduced-motion: no-preference) {
  .sheet-panel { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  .ring-prog { transition: stroke-dashoffset .2s linear; }
  .breathing .ring-breath { animation: breathe 10s ease-in-out infinite; }
  @keyframes breathe { 0% { transform: scale(.62); } 40% { transform: scale(.94); } 100% { transform: scale(.62); } }
}
@media (max-width: 360px) { .stat b { font-size: 1.8rem; } .seg .chip { font-size: .82rem; } }
.sync-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); margin-right: 7px; }
.sync-dot.ok { background: var(--good); } .sync-dot.err { background: var(--bad); } .sync-dot.busy { background: var(--accent); }
.sync-help summary { font-weight: 700; color: var(--accent); cursor: pointer; padding: 4px 0; }

/* ---------------- session builder ---------------- */
const RUN_W = { calf: 3, ham: 3, hipflex: 2.5, hips: 2.5, quad: 2, back: 1, upper: .5 };
const RIDE_W = { hipflex: 3, quad: 3, hips: 2.5, back: 2.5, upper: 2.5, ham: 1.5, calf: 1 };
const BED_W = { hips: 2.5, back: 2.5, ham: 2, hipflex: 1.5, upper: 1.5, calf: 1, quad: 1 };
function areaWeights(purpose, activity) {
  const fr = { run: .75, balanced: .5, ride: .25 }[state.profile.focus] ?? .5;
  const wr = activity === 'run' ? 1 : activity === 'ride' ? 0 : activity === 'both' ? .5 : fr;
  const w = {};
  for (const k of Object.keys(AREAS)) w[k] = RUN_W[k] * wr + RIDE_W[k] * (1 - wr);

}
function holdFor(s, purpose, mins) {

}
const setupFor = (s, first) => Math.max(7, Math.min(13, Math.round((s.name.split(' ').length + s.cues[0].split(' ').length) / 2.6 + 3))) + (first ? 2 : 0);

  const W = areaWeights(purpose, activity);

  const eligible = id => {
    const s = ST[id];
    if (s.kind === 'breath' || finisherIds.includes(id)) return false;
    if (s.roller && !state.profile.roller) return false;
    if (purpose === 'bed' && !s.bed) return false;
    if (s.fixed && purpose !== 'bed' && !(purpose === 'after' && mins >= 15)) return false;
    return true;
  };
  const score = id => {
    const s = ST[id];
    let v = s.areas.reduce((n, a, i) => n + (W[a] || 0) * (i === 0 ? 1 : .5), 0);
    if (spots.includes(s.areas[0])) v += 3; else if (s.areas.some(a => spots.includes(a))) v += 1.5;

  const ranked = Object.keys(ST).filter(eligible).map(id => ({ id, v: score(id) })).sort((a, b) => b.v - a.v);
  const picked = [], count = { roller: 0, dynamic: 0 }, grps = new Set();
  let used = 0;
  let reserve = 0;
  const finishers = [];
  if (purpose === 'bed') {

    if (mins >= 15) finishers.unshift({ id: 'legs_wall', hold: ST.legs_wall.secs, sides: false });
    if (mins <= 5) finishers[finishers.length - 1].hold = 60;

    if (prim.length && prim.some(x => tryAdd(x.id))) continue;

    : purpose === 'after' ? (activity === 'ride' ? 'After a ride: open up the riding position.' : activity === 'both' ? 'After a run and a ride: longer holds, no bouncing.' : 'After a run: longer holds, no bouncing.')
    : activity === 'run' ? 'You ran today.' : activity === 'ride' ? 'You rode today.' : activity === 'both' ? 'You ran and rode today.' : activity === 'rest' ? 'Rest day: a bit more moving mobility work.' : `Weighted toward ${{ run: 'running', balanced: 'running and cycling', ride: 'cycling' }[state.profile.focus]}.`;
  return { items, est: Math.round(items.reduce((n, it, i) => n + costOf(it, i === 0), 0) / 60), reason: `${lead} Focus: ${listTxt(top)}.` };

    file: '',
    other: ''
  };
  const needsFix = () => cfg.token && cfg.error && ['token', 'perm', 'repo', 'file'].includes(cfg.error.kind);
  function statusText() {
    if (!cfg.token) return 'Off';
    if (status === 'syncing') return 'Syncing…';
    if (cfg.error) return MSG[cfg.error.kind] || `Sync didn’t finish: ${cfg.error.msg}. It will retry.`;
    if (cfg.dirty) return 'Changes waiting to sync.';
    return cfg.lastSync ? `Synced ${ago(cfg.lastSync)}.` : 'Connected.';
  }
  const dotCls = () => !cfg.token ? '' : status === 'syncing' ? 'busy' : cfg.error && cfg.error.kind !== 'offline' ? 'err' : 'ok';
  function setStatus(s) {
    status = s;
    const el = document.getElementById('sync-status');
    if (el) { el.textContent = statusText(); const d = document.getElementById('sync-dot'); if (d) d.className = 'sync-dot ' + dotCls(); }
    const mode = !cfg.token ? 'off' : needsFix() ? 'fix:' + cfg.error.kind : 'on';
    if (mode !== lastMode) {
      lastMode = mode;
      const f = document.getElementById('sync-field'), a = document.activeElement;
      if (f && !(a && f.contains(a) && a.tagName === 'INPUT')) f.outerHTML = fieldHtml();
      if (state.tab === 'today' && !document.querySelector('#view input:focus')) render();
    }
  }
  const tokenInputs = (cta) => `<label for="sync-repo">Repository</label><input class="input" id="sync-repo" value="${esc(cfg.repo)}" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
      <label for="sync-token">Access token</label><input class="input" id="sync-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
      <p class="hint">The token stays on this phone and only opens that one repository.</p>
      <div><button class="btn sm primary" data-act="sync-connect">${cta}</button></div>`;
  const steps = `<details class="sync-help"${cfg.token ? '' : ' open'}><summary>How to set it up</summary><ol class="cues">
      <li>On GitHub, create a <b>private</b> repository named <b>fitness-log</b>.</li>
      <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>. Name the token “Fitness apps sync” and choose the longest expiration offered.</li>
      <li>Under <b>Repository access</b>, choose <b>Only select repositories</b>, then <b>fitness-log</b>.</li>
      <li>Under <b>Permissions</b>, add <b>Contents</b> and set it to <b>Read and write</b>.</li>
      <li>Tap <b>Generate token</b>, copy it, and paste it below.</li></ol></details>`;
  function fieldHtml() {
    lastMode = !cfg.token ? 'off' : needsFix() ? 'fix:' + cfg.error.kind : 'on';
    if (!cfg.token) return `<div class="field" id="sync-field"><span class="lbl">Sync to GitHub</span>
      <p class="small muted">Saves every session to a private GitHub repository, so app updates, deleting the app or a new phone never lose your history. Bell Flow and Limber can share the same repository.</p>
      ${steps}${tokenInputs('Connect and sync')}</div>`;
    return `<div class="field" id="sync-field"><span class="lbl">Sync to GitHub</span>
      <p class="small"><span class="sync-dot ${dotCls()}" id="sync-dot"></span><span id="sync-status">${esc(statusText())}</span></p>
      <p class="small muted">Saving to ${esc(cfg.repo)}, file ${esc(C.file)}.</p>
      ${needsFix() ? steps + tokenInputs('Save and sync') : `<div class="row"><button class="btn sm" data-act="sync-now">Sync now</button><button class="btn sm danger" data-act="sync-disconnect">Disconnect</button></div>`}</div>`;
  }
  function bannerHtml() {
    if (needsFix()) return `<div class="banner warm" style="margin-top:12px"><div><p>Sync has stopped</p><span class="small">${esc(MSG[cfg.error.kind] || cfg.error.msg)}</span></div><button class="btn sm primary" data-act="sync-fix">Fix</button></div>`;
    if (!cfg.token && C.count() >= 1 && LS.get(K.nudge, '') !== 'hide') return `<div class="banner"><div><p>Keep your history safe</p><span class="small">Turn on sync so app updates, deleting the app or a new phone never lose a session.</span></div><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="sync-nudge-hide">Not now</button><button class="btn sm primary" data-act="sync-fix">Set up</button></div></div>`;
    return '';
  }
  async function connect() {
    const repo = (document.getElementById('sync-repo') || {}).value || cfg.repo;
    const token = ((document.getElementById('sync-token') || {}).value || '').trim();
    const r = repo.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
    if (!/^[\w.-]+\/[\w.-]+$/.test(r)) { toast('Enter the repository as username/name, like evan579/fitness-log'); return; }
    if (!token) { toast('Paste your access token first'); return; }
    cfg.repo = r; cfg.token = token; cfg.error = null; save();
    toast('Connecting…');
    await run();
    if (!cfg.error) toast(`Synced with ${cfg.repo}`);
    else if (!needsFix()) toast(statusText());
    if (typeof sheetCtx !== 'undefined' && sheetCtx && sheetCtx.type === 'settings') openSettings();
  }
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act^="sync-"]'); if (!el) return;
    switch (el.dataset.act) {
      case 'sync-connect': connect(); break;
      case 'sync-now': cfg.error = null; run(); break;
      case 'sync-disconnect': cfg.token = ''; cfg.error = null; save(); setStatus('off'); openSettings(); toast('Sync turned off. Your log stays on this phone.'); break;
      case 'sync-fix': openSettings(); setTimeout(() => { const f = document.getElementById('sync-field'); if (f) f.scrollIntoView({ block: 'start' }); }, 50); break;
      case 'sync-nudge-hide': LS.set(K.nudge, 'hide'); render(); break;
    }
  });
  return {
    on: () => !!cfg.token,
    changed() { cfg.dirty = true; save(); if (cfg.token) schedule(1500); },
    start() {
      if (cfg.token) run();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && cfg.token && (cfg.dirty || Date.now() - cfg.lastSync > 60000)) run(); });
      window.addEventListener('online', () => { if (cfg.token) run(); });
    },
    fieldHtml, bannerHtml, merge, run
  };
})();

/* ---------------- boot ---------------- */
let swReg = null, swUpdating = false;
render();
Sync.start();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      swReg = reg;
      const ready = () => { if (reg.waiting && navigator.serviceWorker.controller) $('#update-bar').hidden = false; };
      ready();
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') ready(); }); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (swUpdating) location.reload(); });
  });
}
</script>
</body>
</html>
